<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digifyce Platform — Sign In</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1629;--navy2:#111E35;--blue:#2B4EFF;--blue2:#1a3ae0;--red:#EF4444;--white:#fff;--fh:'Segoe UI',system-ui,sans-serif}
html,body{height:100%;font-family:var(--fh);overflow:hidden}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 25% 20%,rgba(43,78,255,.18) 0%,transparent 55%),
  radial-gradient(ellipse at 80% 80%,rgba(245,158,11,.08) 0%,transparent 50%),var(--navy)}
.card{width:400px;background:var(--navy2);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px 36px;animation:fadeUp .5s ease;box-shadow:0 8px 40px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--blue),#6366f1);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700}
.logo-text{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.4px}
.logo-text em{color:#818cf8;font-style:normal}
h1{font-size:24px;font-weight:700;color:#fff;margin-bottom:5px}
.sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:10px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.field input{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font-size:14px;outline:none;transition:all .2s;font-family:var(--fh)}
.field input:focus{border-color:var(--blue);background:rgba(43,78,255,.12);box-shadow:0 0 0 3px rgba(43,78,255,.2)}
.field input::placeholder{color:rgba(255,255,255,.2)}
.btn{width:100%;padding:13px;background:var(--blue);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;font-family:var(--fh)}
.btn:hover{background:var(--blue2);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;color:#fca5a5;font-size:12px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">◈</div>
      <div class="logo-text">DIGI<em>FYCE</em></div>
    </div>
    <h1>Welcome back</h1>
    <div class="sub">Sign in to your internal workspace</div>
    <div class="err" id="err"></div>
    <div class="field"><label>Email address</label><input type="email" id="em" placeholder="you@digifyce.in" autocomplete="email" autofocus></div>
    <div class="field"><label>Password</label><input type="password" id="pw" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn" id="btn" onclick="doLogin()">Sign in →</button>
  </div>
</div>
<script src="/api/config_js.php"></script>
<script>
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('em').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('pw').focus(); });

const apiBase = window.APP_URL ? window.APP_URL.replace(/\/$/, '') : '';

// Redirect if already logged in
const meUrl = apiBase ? (apiBase + '/api/auth/me') : 'api/auth/me';
fetch(meUrl).then(r => { if(r.ok) window.location.href = 'app'; }).catch(()=>{});

async function doLogin() {
  const em = document.getElementById('em').value.trim();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const loginUrl = apiBase ? (apiBase + '/api/auth/login') : 'api/auth/login';
    const r = await fetch(loginUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: em, password: pw }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Login failed');
    window.location.href = 'app';
  } catch(ex) {
    err.textContent = ex.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign in →';
  }
}
</script>
</body>
</html>
